name: Publish agent image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-agent-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'EnvPlane/agent' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.published.outputs.component }}
      repository: ${{ steps.published.outputs.repository }}
      tag: ${{ steps.published.outputs.tag }}
      digest: ${{ steps.published.outputs.digest }}
      metadata: ${{ steps.published.outputs.metadata }}
    steps:
      - uses: actions/checkout@v7
      - id: source_read_app
        name: Create source-read GitHub App token
        env:
          ENVPILOT_AUTOMATION_APP_CLIENT_ID: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          ENVPILOT_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          GH_APP_OWNER: ${{ github.repository_owner }}
          GH_APP_REPOSITORY: deploy
          GH_APP_TOKEN_PERMISSIONS: '{"contents":"read"}'
        run: ./scripts/obtain-github-app-token.sh
      - name: Configure private Go modules
        env:
          SOURCE_TOKEN: ${{ steps.source_read_app.outputs.token }}
        run: |
          set -euo pipefail
          echo 'GOPRIVATE=github.com/envpilot/*' >> "$GITHUB_ENV"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/envpilot-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@v7
        with:
          repository: EnvPlane/deploy
          token: ${{ steps.source_read_app.outputs.token }}
          path: deploy
      - name: Ensure Go toolchain
        run: |
          GO_VERSION_FILE=go.mod \
          ./scripts/ensure-go.sh
      - name: Select module Go toolchain
        run: echo "GOTOOLCHAIN=go$(awk '/^go[[:space:]]/ {print $2; exit}' go.mod)" >> "$GITHUB_ENV"
      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: agent-publish-go-cache-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            agent-publish-go-cache-${{ runner.os }}-
      - name: Use published contracts module
        run: go mod edit -dropreplace=github.com/envpilot/contracts
      - name: Download private modules before running repository code
        run: go mod download
      - name: Remove source credentials before tests
        if: always()
        run: rm -f "$RUNNER_TEMP/envpilot-gitconfig"
      - name: Test agent
        run: go test ./...
      - name: Verify agent has no local chart source
        run: deploy/scripts/check-canonical-chart-sources.sh --deploy "$GITHUB_WORKSPACE/deploy" --agent "$GITHUB_WORKSPACE"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/envpilot/agent
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
          secrets: |
            github_token=${{ steps.source_read_app.outputs.token }}
          provenance: mode=max
          sbom: true
      - name: Scan published image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/envpilot/agent:sha-${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - id: published
        name: Emit immutable image metadata
        env:
          COMPONENT: agent
          REPOSITORY: ghcr.io/envpilot/agent
          TAG: sha-${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          metadata="$(jq -cn \
            --arg component "$COMPONENT" \
            --arg repository "$REPOSITORY" \
            --arg tag "$TAG" \
            --arg digest "$DIGEST" \
            '{component: $component, repository: $repository, tag: $tag, digest: $digest}')"
          printf '%s\n' "$metadata" | tee image-metadata.json
          {
            echo "component=$COMPONENT"
            echo "repository=$REPOSITORY"
            echo "tag=$TAG"
            echo "digest=$DIGEST"
            echo "metadata=$metadata"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-image-metadata
          path: image-metadata.json
          if-no-files-found: error
      - id: deploy_dispatch_app
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          ENVPILOT_AUTOMATION_APP_CLIENT_ID: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          ENVPILOT_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          GH_APP_OWNER: ${{ github.repository_owner }}
          GH_APP_REPOSITORY: deploy
          GH_APP_TOKEN_PERMISSIONS: '{"contents":"write"}'
        run: ./scripts/obtain-github-app-token.sh
      - name: Dispatch immutable image update with GitHub App
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.deploy_dispatch_app.outputs.token }}
          METADATA: ${{ steps.published.outputs.metadata }}
        run: |
          set -euo pipefail
          # Dispatches can briefly return 429/5xx while GitHub is provisioning
          # the target repository. Keep the job bounded but give the API a
          # meaningful recovery window.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 6 --retry-delay 5 --retry-max-time 120 \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository_owner }}/deploy/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -cn --argjson payload "$METADATA" --arg source_repository "${{ github.repository }}" --arg source_revision "${{ github.sha }}" '{event_type:"component-image-published",client_payload:($payload + {source_repository:$source_repository,source_revision:$source_revision,publication_id:($payload.component + ":" + $source_revision + ":" + $payload.digest)})}')"
