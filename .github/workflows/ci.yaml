name: Agent CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Use published contracts module
        run: go mod edit -dropreplace=github.com/envpilot/contracts
      - run: go test ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6
      - run: go test -race ./...
      - run: go test -coverprofile=cover.out ./...
      - name: Enforce coverage floor
        run: |
          total="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')"
          awk -v total="$total" 'BEGIN { if (total < 20) { print "coverage below 20%: " total "%"; exit 1 } }'
